name: Deploy Bot to HeavenCloud

on:
  push:
    branches:
      - main   # Change to master if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install & Build
        run: |
          npm ci
          npm run build

      - name: 4. Upload Compiled Code to Server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/home/container/'
          sftp_only: true

      - name: 5. Sync package.json via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './package.json'
          remote_path: '/home/container/package.json'
          sftp_only: true

      - name: 6. Restart Server via Pterodactyl API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://control.heavencloud.in/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.PTERO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal": "restart"}')
          
          echo "Panel response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Failed to restart server via API. Check your PTERO_API_KEY and PTERO_SERVER_ID."
            exit 1
          fi